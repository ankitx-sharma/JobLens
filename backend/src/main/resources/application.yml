spring:
  application:
    name: joblens

  thymeleaf:
    cache: false

  datasource:
    url: jdbc:postgresql://localhost:5432/joblens
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  ai:
    chat:
      client:
        enabled: false

    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1
          temperature: 0.2